name: Check news feeds

on:
  push:
    paths:
      - 'app/src/main/assets/news/sources.json'
      - 'scripts/check_feeds.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla i feed
        run: python3 scripts/check_feeds.py
