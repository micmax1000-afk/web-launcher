name: Build Native Android APK

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Scarica Gradle 8.2 (con indirizzi di riserva)
        run: |
          set -e
          SHA=38f66cd6eef217b4c35855bb11ea4e9fbc53594ccccb5fb82dfd317ef8c2c5a3
          for u in https://services.gradle.org/distributions/gradle-8.2-bin.zip \
                   https://downloads.gradle.org/distributions/gradle-8.2-bin.zip \
                   https://mirrors.cloud.tencent.com/gradle/gradle-8.2-bin.zip; do
            for t in 1 2 3; do
              if curl -fsSL --connect-timeout 20 --max-time 300 -o /tmp/gradle.zip "$u"; then
                if echo "$SHA  /tmp/gradle.zip" | sha256sum -c -; then break 2; fi
                echo "Impronta diversa da $u: $(sha256sum /tmp/gradle.zip)"
              fi
              echo "Tentativo $t fallito per $u"; sleep 15
            done
          done
          echo "$SHA  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Numero di build
        run: echo "WL_VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Prepara la chiave di firma
        env:
          KS_B64: ${{ secrets.WL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/weblauncher.keystore"
            echo "WL_KEYSTORE_FILE=$RUNNER_TEMP/weblauncher.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret WL_KEYSTORE_BASE64 mancante: APK firmato con chiave di debug (gli aggiornamenti potrebbero richiedere la disinstallazione)"
          fi

      - name: Build
        env:
          WL_KEYSTORE_PASSWORD: ${{ secrets.WL_KEYSTORE_PASSWORD }}
        run: |
          gradle --version
          gradle testDebugUnitTest assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verifica firma fissa
        if: env.WL_KEYSTORE_FILE != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/cert.txt
          grep -qi "c62d5ec3dbf5fff665fbc0b6b8e699dd4896569a2e45bc89c9669d7bf06c1017" /tmp/cert.txt

      - name: Risultati dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web-launcher-native-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  ui-test:
    name: Prova su telefono virtuale
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-launcher-native-apk
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Avvia l'emulatore e prova l'app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/ui-smoke.sh app-debug.apk
      - name: Pubblica le schermate sul ramo ui-shots (si possono guardare senza scaricare nulla)
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls ui-shots/*.png >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/shots && cp ui-shots/*.png /tmp/shots/ && cd /tmp/shots
          printf 'Schermate della prova sul telefono virtuale\nCommit: %s\nRamo: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.txt
          git init -q -b ui-shots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Schermate della prova ($GITHUB_SHA)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-shots || echo "::warning::Pubblicazione delle schermate non riuscita"

      - name: Schermate e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-schermate
          path: ui-shots/
          if-no-files-found: ignore

  publish:
    name: Pubblica la versione
    needs: [build, ui-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.WL_KEYSTORE_BASE64 != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-launcher-native-apk
      - name: Crea la release
        if: env.HAS_KEY == 'true'
        run: |
          CODE=$((1000 + ${{ github.run_number }}))
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app-debug.apk web-launcher.apk
          git log -1 --pretty=%B | grep -v -i '^co-authored-by\|^claude-session' > notes.txt
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            gh release create "v${NAME}-b${CODE}" web-launcher.apk --title "Web Launcher $NAME (build $CODE)" --notes-file notes.txt --target "$GITHUB_SHA"
          else
            gh release create "v${NAME}-prova-b${CODE}" web-launcher.apk --prerelease --title "Prova $NAME (build $CODE)" --notes-file notes.txt --target "$GITHUB_SHA"
            # tiene solo le ultime 3 versioni di prova
            gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' | tail -n +4 | while read t; do
              gh release delete "$t" --yes --cleanup-tag || true
            done
          fi
      - name: Avviso firma mancante
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Aggiungi i secret WL_KEYSTORE_BASE64 e WL_KEYSTORE_PASSWORD per pubblicare le versioni"
