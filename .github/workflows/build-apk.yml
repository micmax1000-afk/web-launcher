name: Build Native Android APK

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Genera icone PNG di fallback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for dens_size in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            dens="${dens_size%%:*}"
            size="${dens_size##*:}"
            mkdir -p "app/src/main/res/mipmap-$dens"
            convert -size ${size}x${size} xc:'#0B1220' \
              -fill '#3B82F6' -draw "roundrectangle $((size*18/100)),$((size*18/100)) $((size*46/100)),$((size*46/100)) $((size*8/100)),$((size*8/100))" \
              -fill '#10B981' -draw "roundrectangle $((size*54/100)),$((size*18/100)) $((size*82/100)),$((size*46/100)) $((size*8/100)),$((size*8/100))" \
              -fill '#F59E0B' -draw "roundrectangle $((size*18/100)),$((size*54/100)) $((size*46/100)),$((size*82/100)) $((size*8/100)),$((size*8/100))" \
              -fill '#EF4444' -draw "roundrectangle $((size*54/100)),$((size*54/100)) $((size*82/100)),$((size*82/100)) $((size*8/100)),$((size*8/100))" \
              "app/src/main/res/mipmap-$dens/ic_launcher.png"
            cp "app/src/main/res/mipmap-$dens/ic_launcher.png" "app/src/main/res/mipmap-$dens/ic_launcher_round.png"
          done

      - name: Scarica Gradle 8.2 (con indirizzi di riserva)
        run: |
          set -e
          SHA=38f66cd6eef217b4c35855bb11ea4e9fbc53594ccccb5fb82dfd317ef8c2c5a3
          for u in https://services.gradle.org/distributions/gradle-8.2-bin.zip \
                   https://downloads.gradle.org/distributions/gradle-8.2-bin.zip \
                   https://mirrors.cloud.tencent.com/gradle/gradle-8.2-bin.zip; do
            for t in 1 2 3; do
              if curl -fsSL --connect-timeout 20 --max-time 300 -o /tmp/gradle.zip "$u"; then
                if echo "$SHA  /tmp/gradle.zip" | sha256sum -c -; then break 2; fi
                echo "Impronta diversa da $u: $(sha256sum /tmp/gradle.zip)"
              fi
              echo "Tentativo $t fallito per $u"; sleep 15
            done
          done
          echo "$SHA  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          gradle --version
          gradle assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web-launcher-native-apk
          path: app/build/outputs/apk/debug/app-debug.apk
