name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configura Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Genera PNG icon da SVG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert -background none www/icon.svg -resize 512x512 www/icon-512.png
          convert -background none www/icon.svg -resize 192x192 www/icon-192.png
          mkdir -p resources
          convert -background none www/icon.svg -resize 1024x1024 resources/icon.png
          convert -background none www/icon.svg -resize 1024x1024 resources/splash.png
          ls -la www/icon-*.png resources/

      - name: Installa dipendenze e prepara Android
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/browser@^5.0.0 @capacitor/assets --save-dev --legacy-peer-deps
          npx capacitor-assets generate --android || true
          npx cap add android || true
          npx cap sync android

      - name: Aggiungi permesso microfono (RECORD_AUDIO)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
              if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
                sed -i 's|android.permission.INTERNET" />|android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />|' "$MANIFEST"
              else
                sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
              fi
            fi
            echo "=== AndroidManifest (permessi) ==="
            grep -E "uses-permission|RECORD_AUDIO|INTERNET" "$MANIFEST" || true
          else
            echo "Manifest non trovato!"
            exit 1
          fi

      - name: Compila APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salva il file APK generato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
