<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Web App Launcher</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
      padding-bottom: 5rem;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(to right, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-add {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
    }

    .search-bar {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--card-bg);
      color: white;
      font-size: 1rem;
      outline: none;
      backdrop-filter: blur(10px);
    }

    .categories-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .category-title {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.4rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 1.2rem;
    }

    .app-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text);
      padding: 0.8rem;
      background: var(--card-bg);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      transition: transform 0.2s;
    }

    .app-card:active {
      transform: scale(0.95);
    }

    .app-icon {
      width: 50px;
      height: 50px;
      border-radius: 0.8rem;
      background: linear-gradient(135deg, #1e293b, #334155);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #60a5fa;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .app-name {
      font-size: 0.8rem;
      text-align: center;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-delete {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      background: var(--danger);
      color: white;
      border-radius: 50%;
      border: none;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-content {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-content input, .modal-content select {
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      color: white;
    }

    .modal-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: white;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <h1>Web Launcher</h1>
      <button class="btn-add" onclick="openModal()">+ Aggiungi App</button>
    </div>
    <input type="text" class="search-bar" id="search" placeholder="Cerca un'app..." oninput="filterApps()">
  </header>

  <main class="categories-container" id="apps-container"></main>

  <!-- Modal Aggiungi App -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>Aggiungi Nuova Web App</h3>
      <input type="text" id="appName" placeholder="Nome App (es. ChatGPT)">
      <input type="url" id="appUrl" placeholder="URL (es. https://chatgpt.com)">
      <select id="appCat">
        <option value="AI Tools">AI Tools</option>
        <option value="Viaggi">Viaggi</option>
        <option value="Shopping">Shopping</option>
        <option value="Produttività">Produttività</option>
        <option value="Intrattenimento">Intrattenimento</option>
        <option value="Utility">Utility</option>
      </select>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Annulla</button>
        <button class="btn-add" onclick="saveApp()">Salva App</button>
      </div>
    </div>
  </div>

  <script>
    const defaultApps = [
      { name: "ChatGPT", url: "https://chatgpt.com", cat: "AI Tools" },
      { name: "Claude", url: "https://claude.ai", cat: "AI Tools" },
      { name: "Gemini", url: "https://gemini.google.com", cat: "AI Tools" },
      { name: "DeepSeek", url: "https://chat.deepseek.com", cat: "AI Tools" },
      { name: "Perplexity", url: "https://perplexity.ai", cat: "AI Tools" },
      { name: "Booking", url: "https://booking.com", cat: "Viaggi" },
      { name: "Skyscanner", url: "https://skyscanner.it", cat: "Viaggi" },
      { name: "EasyJet", url: "https://easyjet.com", cat: "Viaggi" },
      { name: "AliExpress", url: "https://aliexpress.com", cat: "Shopping" },
      { name: "eBay", url: "https://ebay.it", cat: "Shopping" },
      { name: "Vinted", url: "https://vinted.it", cat: "Shopping" },
      { name: "Canva", url: "https://canva.com", cat: "Produttività" },
      { name: "Google Drive", url: "https://drive.google.com", cat: "Produttività" },
      { name: "DeepL", url: "https://deepl.com", cat: "Produttività" },
      { name: "YouTube", url: "https://youtube.com", cat: "Intrattenimento" },
      { name: "Prime Video", url: "https://primevideo.com", cat: "Intrattenimento" },
      { name: "Reddit", url: "https://reddit.com", cat: "Intrattenimento" },
      { name: "WhatsApp Web", url: "https://web.whatsapp.com", cat: "Utility" }
    ];

    let apps = JSON.parse(localStorage.getItem('my_web_apps')) || defaultApps;

    function renderApps() {
      const container = document.getElementById('apps-container');
      container.innerHTML = '';

      const categories = [...new Set(apps.map(a => a.cat))];

      categories.forEach(cat => {
        const catApps = apps.filter(a => a.cat === cat);
        if (catApps.length === 0) return;

        const section = document.createElement('section');
        section.innerHTML = `<h2 class="category-title">${cat}</h2>`;
        
        const grid = document.createElement('div');
        grid.className = 'grid';

        catApps.forEach(app => {
          const index = apps.indexOf(app);
          const initials = app.name.slice(0, 2).toUpperCase();
          grid.innerHTML += `
            <div class="app-card">
              <button class="btn-delete" onclick="deleteApp(event, ${index})">✕</button>
              <a href="${app.url}" target="_blank" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; align-items:center; gap:0.5rem; width:100%;">
                <div class="app-icon">${initials}</div>
                <span class="app-name">${app.name}</span>
              </a>
            </div>
          `;
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function saveApp() {
      const name = document.getElementById('appName').value.trim();
      let url = document.getElementById('appUrl').value.trim();
      const cat = document.getElementById('appCat').value;

      if (!name || !url) return alert('Inserisci sia il nome che l\'URL');
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

      apps.push({ name, url, cat });
      localStorage.setItem('my_web_apps', JSON.stringify(apps));
      renderApps();
      closeModal();

      document.getElementById('appName').value = '';
      document.getElementById('appUrl').value = '';
    }

    function deleteApp(e, index) {
      e.stopPropagation();
      apps.splice(index, 1);
      localStorage.setItem('my_web_apps', JSON.stringify(apps));
      renderApps();
    }

    function filterApps() {
      const q = document.getElementById('search').value.toLowerCase();
      document.querySelectorAll('.app-card').forEach(card => {
        const name = card.querySelector('.app-name').innerText.toLowerCase();
        card.style.display = name.includes(q) ? 'flex' : 'none';
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    renderApps();
  </script>
</body>
</html>
