<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Web Browser</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .omnibox {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    #launcher-view {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem 1rem 5rem 1rem;
    }

    /* Grid App Launcher */
    .categories-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .category-title {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.4rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 1.2rem;
    }

    .app-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
      padding: 0.8rem;
      background: var(--card-bg);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .app-card:active { transform: scale(0.95); }

    .app-icon {
      width: 50px;
      height: 50px;
      border-radius: 0.8rem;
      background: linear-gradient(135deg, #1e293b, #334155);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      color: #60a5fa;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .app-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .app-name {
      font-size: 0.8rem;
      text-align: center;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      position: absolute;
      top: -6px;
      right: -6px;
      display: flex;
      gap: 2px;
      z-index: 2;
    }

    .btn-action {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
    }

    .btn-edit { background: var(--accent); }
    .btn-delete { background: var(--danger); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-content {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-content input, .modal-content select {
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      color: white;
    }

    .modal-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: white;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <input type="text" class="omnibox" id="omnibox" placeholder="Cerca app, digita URL o cerca su Google..." onkeyup="handleOmnibox(event)">
    <button class="btn-icon" onclick="openModal()" title="Aggiungi App">+</button>
  </header>

  <main id="launcher-view">
    <div class="categories-container" id="apps-container"></div>
  </main>

  <!-- Modal Aggiungi App -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>Aggiungi Web App</h3>
      <input type="text" id="appName" placeholder="Nome (es. GitHub)">
      <input type="url" id="appUrl" placeholder="URL (es. https://github.com)">
      <select id="appCat">
        <option value="AI Tools">AI Tools</option>
        <option value="Viaggi">Viaggi</option>
        <option value="Shopping">Shopping</option>
        <option value="Produttività">Produttività</option>
        <option value="Intrattenimento">Intrattenimento</option>
        <option value="Utility">Utility</option>
      </select>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Annulla</button>
        <button class="btn-icon" style="background:var(--accent); width:auto; padding:0 1rem;" onclick="saveApp()">Salva</button>
      </div>
    </div>
  </div>

  <!-- Modal Modifica / Sposta App -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>Modifica / Sposta App</h3>
      <input type="hidden" id="editIndex">
      <input type="text" id="editAppName" placeholder="Nome">
      <input type="url" id="editAppUrl" placeholder="URL">
      <select id="editAppCat">
        <option value="AI Tools">AI Tools</option>
        <option value="Viaggi">Viaggi</option>
        <option value="Shopping">Shopping</option>
        <option value="Produttività">Produttività</option>
        <option value="Intrattenimento">Intrattenimento</option>
        <option value="Utility">Utility</option>
      </select>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeEditModal()">Annulla</button>
        <button class="btn-icon" style="background:var(--accent); width:auto; padding:0 1rem;" onclick="updateApp()">Salva</button>
      </div>
    </div>
  </div>

  <script>
    const defaultApps = [
      { name: "ChatGPT", url: "https://chatgpt.com", cat: "AI Tools" },
      { name: "Claude", url: "https://claude.ai", cat: "AI Tools" },
      { name: "Gemini Web", url: "https://gemini.google.com", cat: "AI Tools" },
      { name: "DeepSeek", url: "https://chat.deepseek.com", cat: "AI Tools" },
      { name: "Booking", url: "https://booking.com", cat: "Viaggi" },
      { name: "YouTube", url: "https://youtube.com", cat: "Intrattenimento" },
      { name: "Wikipedia", url: "https://it.wikipedia.org", cat: "Utility" }
    ];

    let apps = JSON.parse(localStorage.getItem('my_web_apps')) || defaultApps;
    const omnibox = document.getElementById('omnibox');

    function renderApps() {
      const container = document.getElementById('apps-container');
      container.innerHTML = '';
      const categories = [...new Set(apps.map(a => a.cat))];

      categories.forEach(cat => {
        const catApps = apps.filter(a => a.cat === cat);
        if (catApps.length === 0) return;

        const section = document.createElement('section');
        section.innerHTML = `<h2 class="category-title">${cat}</h2>`;
        const grid = document.createElement('div');
        grid.className = 'grid';

        catApps.forEach(app => {
          const index = apps.indexOf(app);
          const initials = app.name.slice(0, 2).toUpperCase();
          let domain = "";
          try { domain = new URL(app.url).hostname; } catch(e) { domain = app.url; }
          const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

          grid.innerHTML += `
            <div class="app-card" onclick="openUrl('${app.url}')">
              <div class="card-actions" onclick="event.stopPropagation()">
                <button class="btn-action btn-edit" onclick="openEditModal(${index})" title="Modifica / Sposta">✏️</button>
                <button class="btn-action btn-delete" onclick="deleteApp(event, ${index})" title="Elimina">✕</button>
              </div>
              <div class="app-icon">
                <img src="${faviconUrl}" alt="${app.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display:none;">${initials}</span>
              </div>
              <span class="app-name">${app.name}</span>
            </div>
          `;
        });
        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    async function openUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      if (window.Capacitor && window.Capacitor.isNativePlatform()) {
        try { await window.Capacitor.Plugins.Browser.open({ url: url }); return; } catch (e) {}
      }
      window.open(url, '_blank');
    }

    function handleOmnibox(e) {
      const val = omnibox.value.trim();
      if (e.key === 'Enter' && val) {
        if (val.includes('.') && !val.includes(' ')) openUrl(val);
        else openUrl(`https://www.google.com/search?q=${encodeURIComponent(val)}`);
        omnibox.value = '';
      } else if (!e.key) {
        filterApps(val);
      }
    }

    function filterApps(q) {
      const query = (q || '').toLowerCase();
      document.querySelectorAll('.app-card').forEach(card => {
        const name = card.querySelector('.app-name').innerText.toLowerCase();
        card.style.display = name.includes(query) ? 'flex' : 'none';
      });
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function openEditModal(index) {
      const app = apps[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('editAppName').value = app.name;
      document.getElementById('editAppUrl').value = app.url;
      document.getElementById('editAppCat').value = app.cat;
      document.getElementById('editModal').style.display = 'flex';
    }
    function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

    function updateApp() {
      const index = document.getElementById('editIndex').value;
      const name = document.getElementById('editAppName').value.trim();
      let url = document.getElementById('editAppUrl').value.trim();
      const cat = document.getElementById('editAppCat').value;
      if (!name || !url) return alert('Inserisci nome e URL');
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      
      apps[index] = { name, url, cat };
      localStorage.setItem('my_web_apps', JSON.stringify(apps));
      renderApps();
      closeEditModal();
    }

    function saveApp() {
      const name = document.getElementById('appName').value.trim();
      let url = document.getElementById('appUrl').value.trim();
      const cat = document.getElementById('appCat').value;
      if (!name || !url) return alert('Inserisci nome e URL');
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      apps.push({ name, url, cat });
      localStorage.setItem('my_web_apps', JSON.stringify(apps));
      renderApps();
      closeModal();
      document.getElementById('appName').value = '';
      document.getElementById('appUrl').value = '';
    }

    function deleteApp(e, index) {
      e.stopPropagation();
      apps.splice(index, 1);
      localStorage.setItem('my_web_apps', JSON.stringify(apps));
      renderApps();
    }

    renderApps();
  </script>
</body>
</html>
