<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Web Browser</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #3b82f6;
      --accent-ai: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .btn-ai-toggle {
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      border: none;
      color: white;
      font-weight: bold;
    }

    .omnibox {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    #main-wrapper {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    #launcher-view {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem 1rem 5rem 1rem;
    }

    /* AI Sidebar Chat Panel */
    #ai-sidebar {
      position: absolute;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 450px;
      height: 100%;
      background: #0f172a;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      transition: right 0.3s ease;
      z-index: 30;
      display: flex;
      flex-direction: column;
    }

    #ai-sidebar.open {
      right: 0;
    }

    .ai-header {
      padding: 0.8rem 1rem;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ai-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .ai-selector {
      background: #0f172a;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      flex: 1;
    }

    /* Area Chat API */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0b1120;
    }

    .chat-messages {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .message {
      max-width: 85%;
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      background: var(--accent);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 0.2rem;
    }

    .message.ai {
      background: #1e293b;
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 0.2rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chat-input-area {
      padding: 0.8rem;
      background: #1e293b;
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.7rem;
      border-radius: 0.5rem;
      color: white;
      outline: none;
      font-size: 0.9rem;
    }

    /* Grid App Launcher */
    .categories-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .category-title {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.4rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 1.2rem;
    }

    .app-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
      padding: 0.8rem;
      background: var(--card-bg);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .app-card:active { transform: scale(0.95); }

    .app-icon {
      width: 50px;
      height: 50px;
      border-radius: 0.8rem;
      background: linear-gradient(135deg, #1e293b, #334155);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      color: #60a5fa;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .app-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .app-name {
      font-size: 0.8rem;
      text-align: center;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      position: absolute;
      top: -6px;
      right: -6px;
      display: flex;
      gap: 2px;
      z-index: 2;
    }

    .btn-action {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
    }

    .btn-edit { background: var(--accent); }
    .btn-delete { background: var(--danger); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-content {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-content input, .modal-content select {
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      color: white;
    }

    .modal-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: white;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <input type="text" class="omnibox" id="omnibox" placeholder="Cerca app, digita URL o cerca sul web..." onkeyup="handleOmnibox(event)">
    <button class="btn-icon" onclick="openApiModal()" title="Configura API Key">🔑</button>
    <button class="btn-icon btn-ai-toggle" onclick="toggleAISidebar()" title="Chat AI">✨</button>
    <button class="btn-icon" onclick="openModal()" title="Aggiungi App">+</button>
  </header>

  <div id="main-wrapper">
    <!-- Vista Launcher Principale -->
    <main id="launcher-view">
      <div class="categories-container" id="apps-container"></div>
    </main>

    <!-- Sidebar Chat API -->
    <aside id="ai-sidebar">
      <div class="ai-header">
        <div class="ai-header-top">
          <select class="ai-selector" id="ai-provider">
            <option value="gemini-flash">Gemini 3.8 Flash (Google)</option>
            <option value="grok">Grok Beta (xAI)</option>
          </select>
          <button class="btn-icon" onclick="clearChatHistory()" title="Elimina Cronologia Chat" style="width:32px; height:32px; font-size:0.8rem;">🗑️</button>
          <button class="btn-icon" onclick="toggleAISidebar()" style="width:32px; height:32px; font-size:0.8rem;">✕</button>
        </div>
      </div>
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
          <div class="message ai">Ciao! Configura la tua chiave API (icona 🔑 in alto) e scrivi qui sotto per iniziare.</div>
        </div>
        <div class="chat-input-area">
          <input type="text" class="chat-input" id="chat-input" placeholder="Scrivi un messaggio..." onkeyup="handleChatInput(event)">
          <button class="btn-icon" style="background:var(--accent);" onclick="sendChatMessage()">➤</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Modal Configurazione API Keys -->
  <div class="modal" id="apiModal">
    <div class="modal-content">
      <h3>Configura Chiavi API</h3>
      <label style="font-size:0.85rem; color:var(--text-muted);">Chiave Gemini ( Google AI Studio )</label>
      <input type="password" id="geminiKey" placeholder="Inserisci Gemini API Key">
      
      <label style="font-size:0.85rem; color:var(--text-muted);">Chiave Grok ( xAI Console )</label>
      <input type="password" id="grokKey" placeholder="Inserisci Grok API Key">
      
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeApiModal()">Annulla</button>
        <button class="btn-icon" style="background:var(--accent); width:auto; padding:0 1rem;" onclick="saveApiKeys()">Salva</button>
      </div>
    </div>
  </div>

  <!-- Modal Aggiungi App -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>Aggiungi Web App</h3>
      <input type="text" id="appName" placeholder="Nome (es. GitHub)">
      <input type="url" id="appUrl" placeholder="URL (es. https://github.com)">
      <select id="appCat">
        <option value="AI Tools">AI Tools</option>
        <option value="Viaggi">Viaggi</option>
        <option value="Shopping">Shopping</option>
        <option value="Produttività">Produttività</option>
        <option value="Intrattenimento">Intrattenimento</option>
        <option value="Utility">Utility</option>
      </select>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Annulla</button>
        <button class="btn-icon" style="background:var(--accent); width:auto; padding:0 1rem;" onclick="saveApp()">Salva</button>
      </div>
    </div>
  </div>

  <!-- Modal Modifica / Sposta App -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>Modifica / Sposta App</h3>
      <input type="hidden" id="editIndex">
      <input type="text" id="editAppName" placeholder="Nome">
      <input type="url" id="editAppUrl" placeholder="URL">
      <select id="editAppCat">
        <option value="AI Tools">AI Tools</option>
        <option value="Viaggi">Viaggi</option>
        <option value="Shopping">Shopping</option>
        <option value="Produttività">Produttività</option>
        <option value="Intrattenimento">Intrattenimento</option>
        <option value="Utility">Utility</option>
      </select>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeEditModal()">Annulla</button>
        <button class="btn-icon" style="background:var(--accent); width:auto; padding:0 1rem;" onclick="updateApp()">Salva</button>
      </div>
    </div>
  </div>

  <script>
    const defaultApps = [
      { name: "ChatGPT", url: "https://chatgpt.com", cat: "AI Tools" },
      { name: "Claude", url: "https://claude.ai", cat: "AI Tools" },
      { name: "Gemini Web", url: "https://gemini.google.com", cat: "AI Tools" },
      { name: "Booking", url: "https://booking.com", cat: "Viaggi" },
      { name: "YouTube", url: "https://youtube.com", cat: "Intrattenimento" },
      { name: "Wikipedia", url: "https://it.wikipedia.org", cat: "Utility" }
    ];

    let apps = JSON.parse(localStorage.getItem('my_web_apps')) || defaultApps;
    let apiKeys = JSON.parse(localStorage.getItem('my_api_keys')) || { gemini: '', grok: '' };
    let chatHistory = JSON.parse(localStorage.getItem('my_chat_history')) || [
      { sender: 'ai', text: 'Ciao! Configura la tua chiave API (icona 🔑 in alto) e scrivi qui sotto per iniziare.' }
    ];

    const omnibox = document.getElementById('omnibox');
    const aiSidebar = document.getElementById('ai-sidebar');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');

    function renderApps() {
      const container = document.getElementById('apps-container');
      container.innerHTML = '';
      const categories = [...new Set(apps.map(a => a.cat))];

      categories.forEach(cat => {
        const catApps = apps.filter(a => a.cat === cat);
        if (catApps.length === 0) return;

        const section = document.createElement('section');
        section.innerHTML = `<h2 class="category-title">${cat}</h2>`;
        const grid = document.createElement('div');
        grid.className = 'grid';

        catApps.forEach(app => {
          const index = apps.indexOf(app);
          const initials = app.name.slice(0, 2).toUpperCase();
          let domain = "";
          try { domain = new URL(app.url).hostname; } catch(e) { domain = app.url; }
          const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

          grid.innerHTML += `
            <div class="app-card" onclick="openUrl('${app.url}')">
              <div class="card-actions" onclick="event.stopPropagation()">
                <button class="btn-action btn-edit" onclick="openEditModal(${index})" title="Modifica / Sposta">✏️</button>
                <button class="btn-action btn-delete" onclick="deleteApp(event, ${index})" title="Elimina">✕</button>
              </div>
              <div class="app-icon">
                <img src="${faviconUrl}" alt="${app.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display:none;">${initials}</span>
              </div>
              <span class="app-name">${app.name}</span>
            </div>
          `;
        });
        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    async function openUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      if (window.Capacitor && window.Capacitor.isNativePlatform()) {
        try { await window.Capacitor.Plugins.Browser.open({ url: url }); return; } catch (e) {}
      }
      window.open(url, '_blank');
    }

    function handleOmnibox(e) {
      const val = omnibox.value.trim();
      if (e.key === 'Enter' && val) {
        if (val.includes('.') && !val.includes(' ')) openUrl(val);
        else openUrl(`https://www.google.com/search?q=${encodeURIComponent(val)}`);
        omnibox.value = '';
      } else if (!e.key) {
        filterApps(val);
      }
    }

    function toggleAISidebar() { aiSidebar.classList.toggle('open'); }

    function openApiModal() {
      document.getElementById('geminiKey').value = apiKeys.gemini;
      document.getElementById('grokKey').value = apiKeys.grok;
      document.getElementById('apiModal').style.display = 'flex';
    }
    function closeApiModal() { document.getElementById('apiModal').style.display = 'none'; }

    function saveApiKeys() {
      apiKeys.gemini = document.getElementById('geminiKey').value.trim();
      apiKeys.grok = document.getElementById('grokKey').value.trim();
      localStorage.setItem('my_api_keys', JSON.stringify(apiKeys));
      closeApiModal();
      alert('Chiavi API salvate con successo!');
    }

    function handleChatInput(e) {
      if (e.key === 'Enter') sendChatMessage();
    }

    function renderChatHistory() {
      chatMessages.innerHTML = '';
      chatHistory.forEach(item => {
        const msg = document.createElement('div');
        msg.className = `message ${item.sender}`;
        msg.innerText = item.text;
        chatMessages.appendChild(msg);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function clearChatHistory() {
      chatHistory = [{ sender: 'ai', text: 'Cronologia eliminata. Scrivi un nuovo messaggio per iniziare.' }];
      localStorage.removeItem('my_chat_history');
      renderChatHistory();
    }

    async function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      chatHistory.push({ sender: 'user', text: text });
      renderChatHistory();
      chatInput.value = '';

      const provider = document.getElementById('ai-provider').value;
      const isGrok = provider === 'grok';
      const key = isGrok ? apiKeys.grok : apiKeys.gemini;

      if (!key) {
        chatHistory.push({ sender: 'ai', text: `Errore: Inserisci prima la chiave API per il servizio selezionato cliccando sull'icona della chiave (🔑) in alto.` });
        renderChatHistory();
        return;
      }

      chatHistory.push({ sender: 'ai', text: 'Sto elaborando la risposta...' });
      renderChatHistory();

      try {
        let reply = "";
        if (provider === 'gemini-flash') {
          reply = await callGeminiAPI(text, key);
        } else if (provider === 'grok') {
          reply = await callGrokAPI(text, key);
        }
        chatHistory.pop();
        chatHistory.push({ sender: 'ai', text: reply });
      } catch (err) {
        chatHistory.pop();
        chatHistory.push({ sender: 'ai', text: "Errore di connessione o chiave non valida: " + err.message });
      }
      localStorage.setItem('my_chat_history', JSON.stringify(chatHistory));
      renderChatHistory();
    }

    async function callGeminiAPI(prompt, apiKey) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts[0].text;
    }

    async function callGrokAPI(prompt, apiKey) {
      const response = await fetch('https://api.x.ai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'grok-beta',
          messages: [{ role: 'user', content: prompt }]
        })
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      return data.choices[0].message.content;
    }

    function filterApps(q) {
      const query = (q || '').toLowerCase();
      document.querySelectorAll('.app-card').forEach(card => {
        const name = card.querySelector('.app-name').innerText.toLowerCase();
        card.style.display = name.includes(query) ? 'flex' : 'none';
      });
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function openEditModal(index) {
      const app = apps[index];
      document.getElementById('editIndex').value
