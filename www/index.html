<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Web Browser</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #3b82f6;
      --accent-ai: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .btn-ai-toggle {
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      border: none;
      color: white;
      font-weight: bold;
    }

    .omnibox {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    #main-wrapper {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    #launcher-view {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem 1rem 5rem 1rem;
    }

    /* AI Sidebar Panel */
    #ai-sidebar {
      position: absolute;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 450px;
      height: 100%;
      background: #0f172a;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      transition: right 0.3s ease;
      z-index: 30;
      display: flex;
      flex-direction: column;
    }

    #ai-sidebar.open {
      right: 0;
    }

    .ai-header {
      padding: 0.8rem 1rem;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ai-selector {
      background: #0f172a;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
    }

    #ai-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    .categories-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .category-title {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.4rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 1.2rem;
    }

    .app-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
      padding: 0.8rem;
      background: var(--card-bg);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .app-card:active { transform: scale(0.95); }

    .app-icon {
      width: 50px;
      height: 50px;
      border-radius: 0.8rem;
      background: linear-gradient(135deg, #1e293b, #334155);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      color: #60a5fa;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .app-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .app-name {
      font-size: 0.8rem;
      text-align: center;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-delete {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      background: var(--danger);
      color: white;
      border-radius: 50%;
      border: none;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-content {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-content input, .modal-content select {
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      color: white;
    }

    .modal-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: white;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <input type="text" class="omnibox" id="omnibox" placeholder="Cerca app, digita URL o cerca sul web..." onkeyup="handleOmnibox(event)">
    <button class="btn-icon btn-ai-toggle" onclick="toggleAISidebar()" title="Assistente AI">✨</button>
    <button class="btn-icon" onclick="openModal()" title="Aggiungi App">+</button>
  </header>

  <div id="main-wrapper">
    <!-- Vista Launcher Principale -->
    <main id="launcher-view">
      <div class="categories-container" id="apps-container"></div>
    </main>

    <!-- Sidebar AI Integrata -->
    <aside id="ai-sidebar">
      <div class="ai-header">
        <span>🤖 AI Assistant</span>
        <select class="ai-selector" id="ai-provider" onchange="switchAIProvider()">
          <option value="https://chatgpt.com">ChatGPT</option>
          <option value="https://gemini.google.com">Gemini</option>
          <option value="https://claude.ai">Claude</option>
          <option value="https://chat.deepseek.com">DeepSeek</option>
          <option value="https://perplexity.ai">Perplexity</option>
        </select>
        <button class="btn-icon" onclick="toggleAISidebar()">✕</button>
      </div>
      <iframe id="ai-frame" src="https://chatgpt.com"></iframe>
    </aside>
  </div>

  <!-- Modal Aggiungi App -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>Aggiungi Web App / Tool AI</h3>
      <input type="text" id="appName" placeholder="Nome (es. ChatGPT)">
      <input type="url" id="appUrl" placeholder="URL (es. https://chatgpt.com)">
      <select id="appCat">
        <option value="AI Tools">AI Tools</option>
        <option value="Viaggi">Viaggi</option>
        <option value="Shopping">Shopping</option>
        <option value="Produttività">Produttività</option>
        <option value="Intrattenimento">Intrattenimento</option>
        <option value="Utility">Utility</option>
      </select>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Annulla</button>
        <button class="btn-icon" style="background:var(--accent); width:auto; padding:0 1rem;" onclick="saveApp()">Salva</button>
      </div>
    </div>
  </div>

  <script>
    const defaultApps = [
      { name: "ChatGPT", url: "https://chatgpt.com", cat: "AI Tools" },
      { name: "Claude", url: "https://claude.ai", cat: "AI Tools" },
      { name: "Gemini", url: "https://gemini.google.com", cat: "AI Tools" },
      { name: "DeepSeek", url: "https://chat.deepseek.com", cat: "AI Tools" },
      { name: "Perplexity", url: "https://perplexity.ai", cat: "AI Tools" },
      { name: "Booking", url: "https://booking.com", cat: "Viaggi" },
      { name: "Skyscanner", url: "https://skyscanner.it", cat: "Viaggi" },
      { name: "EasyJet", url: "https://easyjet.com", cat: "Viaggi" },
      { name: "AliExpress", url: "https://aliexpress.com", cat: "Shopping" },
      { name: "eBay", url: "https://ebay.it", cat: "Shopping" },
      { name: "Vinted", url: "https://vinted.it", cat: "Shopping" },
      { name: "Canva", url: "https://canva.com", cat: "Produttività" },
      { name: "Google Drive", url: "https://drive.google.com", cat: "Produttività" },
      { name: "DeepL", url: "https://deepl.com", cat: "Produttività" },
      { name: "YouTube", url: "https://youtube.com", cat: "Intrattenimento" },
      { name: "Prime Video", url: "https://primevideo.com", cat: "Intrattenimento" },
      { name: "Reddit", url: "https://reddit.com", cat: "Intrattenimento" },
      { name: "Wikipedia", url: "https://it.wikipedia.org", cat: "Utility" }
    ];

    let apps = JSON.parse(localStorage.getItem('my_web_apps')) || defaultApps;
    const omnibox = document.getElementById('omnibox');
    const aiSidebar = document.getElementById('ai-sidebar');
    const aiFrame = document.getElementById('ai-frame');

    function renderApps() {
      const container = document.getElementById('apps-container');
      container.innerHTML = '';
      const categories = [...new Set(apps.map(a => a.cat))];

      categories.forEach(cat => {
        const catApps = apps.filter(a => a.cat === cat);
        if (catApps.length === 0) return;

        const section = document.createElement('section');
        section.innerHTML = `<h2 class="category-title">${cat}</h2>`;
        
        const grid = document.createElement('div');
        grid.className = 'grid';

        catApps.forEach(app => {
          const index = apps.indexOf(app);
          const initials = app.name.slice(0, 2).toUpperCase();
          
          let domain = "";
          try { domain = new URL(app.url).hostname; } catch(e) { domain = app.url; }
          const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

          grid.innerHTML += `
            <div class="app-card" onclick="openUrl('${app.url}')">
              <button class="btn-delete" onclick="deleteApp(event, ${index})">✕</button>
              <div class="app-icon">
                <img src="${faviconUrl}" alt="${app.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display:none;">${initials}</span>
              </div>
              <span class="app-name">${app.name}</span>
            </div>
          `;
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    async function openUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      
      // Se siamo nell'app nativa Capacitor, usa il plugin Browser per aprire qualsiasi HTTPS senza blocchi
      if (window.Capacitor && window.Capacitor.isNativePlatform()) {
        try {
          await window.Capacitor.Plugins.Browser.open({ url: url });
          return;
        } catch (e) {
          console.log("Browser plugin non disponibile, fallback su window.open");
        }
      }
      
      // Fallback per browser web standard
      window.open(url, '_blank');
    }

    function handleOmnibox(e) {
      const val = omnibox.value.trim();
      if (e.key === 'Enter') {
        if (!val) return;
        if (val.includes('.') && !val.includes(' ')) {
          openUrl(val);
        } else {
          openUrl(`https://www.google.com/search?q=${encodeURIComponent(val)}`);
        }
        omnibox.value = '';
      } else {
        filterApps(val);
      }
    }

    function toggleAISidebar() {
      aiSidebar.classList.toggle('open');
    }

    function switchAIProvider() {
      const providerUrl = document.getElementById('ai-provider').value;
      aiFrame.src = providerUrl;
    }

    function filterApps(q) {
      const query = (q || '').toLowerCase();
      document.querySelectorAll('.app-card').forEach(card => {
        const name = card.querySelector('.app-name').innerText.toLowerCase();
        card.style.display = name.includes(query) ? 'flex' : 'none';
      });
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function saveApp() {
      const name = document.getElementById('appName').value.trim();
      let url = document.getElementById('appUrl').value.trim();
      const cat = document.getElementById('appCat').value;

      if (!name || !url) return alert('Inserisci sia il nome che l\'URL');
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

      apps.push({ name, url, cat });
      localStorage.setItem('my_web_apps', JSON.stringify(apps));
      renderApps();
      closeModal();

      document.getElementById('appName').value = '';
      document.getElementById('appUrl').value = '';
    }

    function deleteApp(e, index) {
      e.stopPropagation();
      apps.splice(index, 1);
      localStorage.setItem('my_web_apps', JSON.stringify(apps));
      renderApps();
    }

    renderApps();
  </script>
</body>
</html>
