<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Web Launcher AI</title></head>
<body>
<!-- Invisible page on Mia AI's origin: same localStorage, so it uses the provider,
     API key and model configured in Mia AI, through Mia AI's own provider code. -->
<script src="../mia-ai/js/providers.js"></script>
<script>
(function () {
  'use strict';
  var P = window.MiaProviders;
  var LS = 'miaai_v1_settings';

  function settings() {
    try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; }
  }
  function cfgFor(s, provider, model) {
    var preset = P.PRESETS[provider] || P.PRESETS.custom;
    var saved = (s.profiles || {})[provider] || {};
    return {
      provider: provider,
      baseUrl: saved.baseUrl || preset.baseUrl,
      apiKey: saved.apiKey || '',
      model: model || (saved.model != null && saved.model !== '' ? saved.model : preset.model),
      temperature: Number(s.temperature != null ? s.temperature : 0.7)
    };
  }
  function configured(c) {
    var preset = P.PRESETS[c.provider] || P.PRESETS.custom;
    return !!c.model && (!preset.needsKey || !!c.apiKey);
  }
  function label(c) {
    var preset = P.PRESETS[c.provider] || P.PRESETS.custom;
    return (preset.short || preset.label) + ' · ' + c.model;
  }
  function post(o) { if (window.WLAi) WLAi.postMessage(JSON.stringify(o)); }

  window.wlStatus = function () {
    var s = settings();
    var c = cfgFor(s, s.provider || 'gemini');
    return JSON.stringify({ configured: configured(c), label: c.model ? label(c) : '' });
  };

  // ---------- natural voice: Gemini text-to-speech with the key saved in Mia AI ----------
  var ttsModel = null;
  function geminiKey() { var g = (settings().profiles || {}).gemini || {}; return g.apiKey || ''; }
  window.wlHasGemini = function () { return geminiKey() ? 'true' : 'false'; };
  async function pickTtsModel(key) {
    if (ttsModel) return ttsModel;
    try {
      var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(key));
      var j = await r.json();
      var l = (j.models || []).filter(function (m) { return /tts/i.test(m.name) && (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0; })
        .map(function (m) { return m.name.replace(/^models\//, ''); });
      l.sort(function (a, b) { return (/flash/.test(b) ? 1 : 0) - (/flash/.test(a) ? 1 : 0) || (/preview/.test(a) ? 1 : 0) - (/preview/.test(b) ? 1 : 0); });
      ttsModel = l[0] || 'gemini-2.5-flash-preview-tts';
    } catch (e) { ttsModel = 'gemini-2.5-flash-preview-tts'; }
    return ttsModel;
  }
  window.wlTts = async function (id, text, voice) {
    var key = geminiKey();
    if (!key) { post({ id: id, t: 'error', code: 'nokey', message: 'Serve la chiave Gemini in Mia AI.' }); return; }
    try {
      var model = await pickTtsModel(key);
      var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }],
          generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice || 'Kore' } } } } })
      });
      if (!res.ok) { var t = await res.text(); post({ id: id, t: 'error', message: 'Gemini ' + res.status + ': ' + t.slice(0, 160) }); return; }
      var j = await res.json();
      var parts = (((j.candidates || [])[0] || {}).content || {}).parts || [], d = null;
      for (var i = 0; i < parts.length; i++) if (parts[i].inlineData) d = parts[i].inlineData;
      if (!d || !d.data) { post({ id: id, t: 'error', message: 'Gemini non ha restituito audio' }); return; }
      post({ id: id, t: 'audio', data: d.data, mime: d.mimeType || '' });
    } catch (e) { post({ id: id, t: 'error', message: String((e && e.message) || e) }); }
  };

  // ---------- Lira voice: Piper neural voices (same recipe as the Lira project), offline after the first download ----------
  var piperLib = null, piperQ = Promise.resolve();
  var PIPER_URLS = [
    'https://esm.sh/@mintplex-labs/piper-tts-web@1.0.5?deps=onnxruntime-web@1.31.1',
    'https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.5/+esm'
  ];
  async function loadPiper() {
    if (piperLib) return piperLib;
    var last = null;
    for (var i = 0; i < PIPER_URLS.length; i++) {
      try { piperLib = await import(PIPER_URLS[i]); if (piperLib && piperLib.TtsSession) return piperLib; last = new Error('TtsSession mancante in ' + PIPER_URLS[i] + ' (' + Object.keys(piperLib || {}).join(',') + ')'); piperLib = null; }
      catch (e) { last = e; console.log('piper import ' + i + ' fallito: ' + ((e && e.message) || e)); }
    }
    throw last || new Error('Libreria della voce non caricata');
  }
  function blobToBase64(blob) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(',')[1]); };
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  }
  async function piperSpeak(id, text, voiceId) {
    try { Object.defineProperty(navigator, 'hardwareConcurrency', { configurable: true, get: function () { return 1; } }); } catch (e) {}
    post({ id: id, t: 'partial', text: 'Carico la libreria della voce' });
    var lib = await loadPiper();
    post({ id: id, t: 'partial', text: 'Libreria pronta' });
    var T = lib.TtsSession;
    if (T._instance && T._instance.voiceId !== voiceId) T._instance = null;
    var session = new T({
      voiceId: voiceId,
      progress: function (p) {
        if (!p || (p.url && String(p.url).indexOf('tts://') === 0)) return;
        var pct = p.total > 0 ? Math.min(99, Math.round(p.loaded / p.total * 100)) : 0;
        post({ id: id, t: 'partial', text: pct > 0 ? 'Scarico la voce · ' + pct + '%' : 'Scarico la voce' });
      },
      wasmPaths: { onnxWasm: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/', piperData: lib.WASM_BASE + '.data', piperWasm: lib.WASM_BASE + '.wasm' }
    });
    if (session.waitReady instanceof Promise) await session.waitReady;
    post({ id: id, t: 'partial', text: 'Voce pronta, preparo il parlato' });
    var blob = await session.predict(text);
    post({ id: id, t: 'audio', data: await blobToBase64(blob), mime: 'audio/wav' });
  }
  // one request at a time: the voice engine cannot work on two texts together
  window.wlPiper = function (id, text, voiceId) {
    piperQ = piperQ.then(function () { return piperSpeak(id, text, voiceId); })
      .catch(function (e) { post({ id: id, t: 'error', message: String((e && e.message) || e) }); });
  };

  window.wlAbort = function () { try { P.abort(); } catch (e) {} };

  window.wlAsk = async function (id, messagesJson, system) {
    var s = settings();
    var main = cfgFor(s, s.provider || 'gemini');
    if (!configured(main)) {
      post({ id: id, t: 'error', code: 'nokey', message: 'Configura provider e chiave in Mia AI.' });
      return;
    }
    var attempts = [main];
    if (s.autoFallback !== false && Array.isArray(s.favorites)) {
      s.favorites.forEach(function (f) {
        if (f.provider === main.provider && f.model === main.model) return;
        if (P.isSpecialized(f.model)) return;
        var c = cfgFor(s, f.provider, f.model);
        if (configured(c)) attempts.push(c);
      });
    }
    var msgs = JSON.parse(messagesJson);
    // attachments saved by the app (scans, recordings): read them and inline as base64
    try {
      for (var mi = 0; mi < msgs.length; mi++) {
        var atts = msgs[mi].attachments || [];
        for (var ai = 0; ai < atts.length; ai++) {
          var at = atts[ai];
          if (at.url && !at.data) {
            var blob = await (await fetch(at.url)).blob();
            at.data = await new Promise(function (res, rej) {
              var fr = new FileReader();
              fr.onload = function () { res(String(fr.result).split(',')[1]); };
              fr.onerror = rej;
              fr.readAsDataURL(blob);
            });
            delete at.url;
          }
        }
      }
    } catch (e) {
      post({ id: id, t: 'error', message: 'Allegato non leggibile: ' + e.message });
      return;
    }
    var lastErr = null;
    for (var i = 0; i < attempts.length && i < 4; i++) {
      var c = attempts[i];
      c.systemPrompt = system || s.systemPrompt || '';
      try {
        var text = await P.chat(c, msgs, function (full) { post({ id: id, t: 'partial', text: full }); });
        post({ id: id, t: 'done', text: text, model: label(c) });
        return;
      } catch (e) {
        lastErr = e;
        if (e && e.name === 'AbortError') { post({ id: id, t: 'error', message: 'Interrotto' }); return; }
        if (!P.isBusyError(e)) break;
      }
    }
    var msg;
    try { msg = P.friendlyError(lastErr, (P.PRESETS[main.provider] || {}).label); }
    catch (x) { msg = String((lastErr && lastErr.message) || lastErr); }
    post({ id: id, t: 'error', message: String(msg) });
  };
})();
</script>
</body>
</html>
